name: Verify published release bytes
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify delivered assets against manifest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-release.py "$RELEASE_TAG"
