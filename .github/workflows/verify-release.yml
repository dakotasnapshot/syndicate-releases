name: Verify published release bytes
run-name: Verify ${{ inputs.tag || github.event.release.tag_name }}
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify delivered assets against manifest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-release.py "$RELEASE_TAG"
